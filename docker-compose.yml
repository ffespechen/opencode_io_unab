services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: iot-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"    # MQTT estándar (publicación/suscripción)
      - "9001:9001"    # MQTT sobre WebSockets (clients web/browser)
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - iot-net

  nodered:
    build:
      context: .
      dockerfile: Dockerfile.nodered
    container_name: iot-nodered
    restart: unless-stopped
    ports:
      - "1880:1880"    # Interfaz web de NodeRED (editor y dashboard)
    volumes:
      - nodered_data:/data
    environment:
      - TZ=America/Santiago
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    depends_on:
      - mosquitto
      - mongodb
    networks:
      - iot-net

  mongodb:
    image: mongo:7
    container_name: iot-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"  # MongoDB (conexión desde NodeRED y clientes)
    volumes:
      - mongodb_data:/data/db
    networks:
      - iot-net

  webapp:
    build:
      context: ./webapp
      dockerfile: Dockerfile
    container_name: iot-webapp
    restart: unless-stopped
    ports:
      - "3000:3000"    # API REST e interfaz web CRUDL
    environment:
      - MONGODB_URI=mongodb://iot-mongodb:27017/iot
      - PORT=3000
    depends_on:
      - mongodb
    networks:
      - iot-net

  fastapi:
    build:
      context: ./fastapi_app
      dockerfile: Dockerfile
    container_name: iot-fastapi
    restart: unless-stopped
    ports:
      - "5000:5000"    # API REST e interfaz web CRUDL (FastAPI)
    environment:
      - MONGODB_URI=mongodb://iot-mongodb:27017/iot
    depends_on:
      - mongodb
    networks:
      - iot-net

volumes:
  mosquitto_data:
  mosquitto_log:
  nodered_data:
  mongodb_data:

networks:
  iot-net:
    driver: bridge
